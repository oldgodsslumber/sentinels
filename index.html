// Sync scene's derived sceneZone from the tracker, then refresh affected views.
function syncSceneZone(){
  S.scene.sceneZone=computeSceneZone(S.scene.tracker);
  save();renderScene();renderHero();renderHeroDiceSidebar();
  if(el('page-dice').classList.contains('active'))renderDice();
}
// Apply a preset tracker shape (Prolonged/Standard/Epic) and reset progress.
function setTrackerPreset(name){
  const p=TRACKER_PRESETS[name];if(!p)return;
  S.scene.tracker={preset:name,green:p.green,yellow:p.yellow,red:p.red,filled:0};
  syncSceneZone();
}
// Override one zone's space count (used by custom mode). Clamps to 1..15.
function setTrackerSpaces(zone,n){
  const t=S.scene.tracker;if(!t)return;
  n=Math.max(1,Math.min(15,parseInt(n)||1));
  t[zone]=n;t.preset='custom';
  if(t.filled>t.green+t.yellow+t.red)t.filled=t.green+t.yellow+t.red;
  syncSceneZone();
}
// Advance/rewind the tracker by N spaces. Clamped [0, total].
function tickTracker(d){
  const t=S.scene.tracker;if(!t)return;
  const total=t.green+t.yellow+t.red;
  t.filled=Math.max(0,Math.min(total,(t.filled|0)+d));
  syncSceneZone();
}
// Click a specific space to jump there: filled = N means N spaces are checked.
function setTrackerFilled(n){
  const t=S.scene.tracker;if(!t)return;
  const total=t.green+t.yellow+t.red;
  t.filled=Math.max(0,Math.min(total,n|0));
  syncSceneZone();
}
// Legacy entry point — kept so any older callers still work; jumps the tracker
// to the start of the requested zone.
function setSceneZone(z){
  const t=S.scene.tracker;if(!t){S.scene.sceneZone=z;save();renderScene();return;}
  if(z==='green')t.filled=0;
  else if(z==='yellow')t.filled=t.green;
  else if(z==='red')t.filled=t.green+t.yellow;
  else if(z==='out')t.filled=t.green+t.yellow+t.red;
  syncSceneZone();
}
function setSceneNotes(v){S.scene.sceneNotes=v;save();}
function addTwist(text){S.scene.twists.push({id:uid(),text:text||'Twist!',resolved:false});save();renderScene();}
function toggleTwist(id){const t=S.scene.twists.find(x=>x.id===id);if(t){t.resolved=!t.resolved;save();renderScene();}}
function removeTwist(id){S.scene.twists=S.scene.twists.filter(x=>x.id!==id);save();renderScene();}
function renderScene(){
  if(!S.hero){el('scene-content').innerHTML='<div class="pg-title">Scene</div><div class="pg-sub">Create a hero first.</div>';return;}
  const sZ=S.scene.sceneZone,hZ=getHeroZone(S.scene.heroHP,S.hero.status),eZ=getEffectiveZone(),sd=getStatusDie();
  let h=`<div class="pg-title">Scene Monitor</div><div class="pg-sub">Track the scene's GYRO state and your hero's health. The dice roller pulls your status die from here automatically.</div>`;
  // SCENE TRACKER (rulebook p.188 — checkboxes broken into Green/Yellow/Red)
  const t=S.scene.tracker;
  const total=t.green+t.yellow+t.red;
  // Build the row of spaces. Zone of space i (0-indexed from start) is determined by cumulative counts.
  const spaces=[];
  for(let i=0;i<total;i++){
    const zone=i<t.green?'green':(i<t.green+t.yellow?'yellow':'red');
    const filled=i<t.filled;
    // Leftmost unchecked = current scene position
    const isCurrent=(i===t.filled);
    spaces.push(`<button class="track-space ${zone} ${filled?'filled':''} ${isCurrent?'current':''}" title="Space ${i+1} (${zone})" onclick="setTrackerFilled(${i+1===t.filled?i:i+1})">${filled?'✓':(isCurrent?'▶':'')}</button>`);
  }
  const presets=['prolonged','standard','epic'];
  const isOut=t.filled>=total;
  h+=`<div class="card"><div class="label">Scene Tracker</div>
    <div class="flex-row" style="gap:6px;flex-wrap:wrap;justify-content:center">
      ${presets.map(p=>`<button class="btn btn-xs ${t.preset===p?'btn-primary':'btn-secondary'}" onclick="setTrackerPreset('${p}')">${TRACKER_PRESETS[p].label} (${TRACKER_PRESETS[p].green}/${TRACKER_PRESETS[p].yellow}/${TRACKER_PRESETS[p].red})</button>`).join('')}
      <span class="text-muted" style="font-size:11px;align-self:center">${t.preset==='custom'?'Custom':''}</span>
    </div>
    <div class="track-row">${spaces.join('')}</div>
    <div class="flex-row" style="justify-content:center;gap:6px;margin-top:4px">
      <button class="btn btn-secondary btn-sm" onclick="tickTracker(-1)" ${t.filled<=0?'disabled':''}>◀ Back</button>
      <button class="btn btn-danger btn-sm" onclick="tickTracker(1)" ${isOut?'disabled':''}>Tick ▶</button>
      <button class="btn btn-secondary btn-sm" onclick="setTrackerFilled(0)">Reset</button>
    </div>
    <div style="text-align:center;margin-top:6px;font-size:12px">Scene status: <span class="zone-badge ${sZ}">${sZ.toUpperCase()}</span> ${isOut?'<span style="color:var(--accent);font-family:var(--font-label);font-weight:700;margin-left:6px">SCENE OUT</span>':`<span class="text-muted" style="margin-left:6px">${t.filled}/${total} spaces filled</span>`}</div>
    <div class="track-edit">
      <label>G</label><input type="number" min="1" max="15" value="${t.green}" onchange="setTrackerSpaces('green',this.value)">
      <label>Y</label><input type="number" min="1" max="15" value="${t.yellow}" onchange="setTrackerSpaces('yellow',this.value)">
      <label>R</label><input type="number" min="1" max="15" value="${t.red}" onchange="setTrackerSpaces('red',this.value)">
      <span class="text-muted" style="font-size:10px">edit to customize</span>
    </div>
    <div class="form-group mt-2"><label>Scene Notes</label><textarea oninput="setSceneNotes(this.value)" placeholder="Where you are, who's there, what's at stake…">${esc(S.scene.sceneNotes||'')}</textarea></div>
  </div>`;
  // HERO HEALTH
  h+=`<div class="card"><div class="label">Hero: ${esc(S.hero.name)}</div>
    ${renderHPBar(S.scene.heroHP,S.hero.status)}
    <div class="flex-row mt-1" style="flex-wrap:wrap;gap:4px">
      <button class="hp-btn danger" onclick="adjustHeroHP(-1)">−1</button>
      <button class="hp-btn danger" onclick="adjustHeroHP(-3)">−3</button>
      <button class="hp-btn danger" onclick="adjustHeroHP(-5)">−5</button>
      <input type="number" id="hp-custom" placeholder="±N" style="width:80px;padding:6px 8px;font-size:12px"> <button class="btn btn-secondary btn-xs" onclick="adjustHeroHP(parseInt(el('hp-custom').value)||0);el('hp-custom').value=''">Apply</button>
      <button class="hp-btn heal" onclick="adjustHeroHP(1)">+1</button>
      <button class="hp-btn heal" onclick="adjustHeroHP(3)">+3</button>
      <button class="hp-btn heal" onclick="adjustHeroHP(999)">Full</button>
    </div>
  </div>`;
  // EFFECTIVE STATUS DIE
  h+=`<div class="card" style="text-align:center">
    <div class="label">Effective Status Die</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0;font-size:12px">
      <div><div class="text-muted" style="font-size:10px;text-transform:uppercase;font-family:var(--font-label)">Hero zone</div><span class="zone-badge ${hZ}">${hZ.toUpperCase()}</span></div>
      <div><div class="text-muted" style="font-size:10px;text-transform:uppercase;font-family:var(--font-label)">Scene zone</div><span class="zone-badge ${sZ}">${sZ.toUpperCase()}</span></div>
      <div><div class="text-muted" style="font-size:10px;text-transform:uppercase;font-family:var(--font-label)">Worse-of</div><span class="zone-badge ${eZ}">${eZ.toUpperCase()}</span></div>
    </div>
    <div class="die-badge ${sd}" style="font-size:22px;width:62px;height:50px;margin:0 auto">${sd}</div>
    <div class="text-muted mt-2" style="font-size:11px">Used as the status die in any roll</div>
  </div>`;
  // ENVIRONMENT
  h+=`<div class="card"><div class="label" style="display:flex;align-items:center;gap:6px">Environment ${S.environment?'':`<button class="btn btn-secondary btn-xs" onclick="addEnvironment()">+ Add</button>`}</div>`;
  if(S.environment){
    h+=`<div class="form-group"><label>Name</label><input type="text" value="${esc(S.environment.name||'')}" oninput="S.environment.name=this.value;save()"></div>`;
    S.environment.traits.forEach((t,i)=>{
      h+=`<div class="qual-row"><input type="text" value="${esc(t.name)}" oninput="S.environment.traits[${i}].name=this.value;save()" placeholder="Trait" style="flex:1"><select onchange="S.environment.traits[${i}].die=this.value;save()">${['d6','d8','d10','d12'].map(d=>`<option ${t.die===d?'selected':''}>${d}</option>`).join('')}</select><button class="btn btn-info btn-xs" onclick="rollEnvTrait(${i})">Roll</button><button class="btn btn-danger btn-xs" onclick="removeEnvTrait(${i})">×</button></div>`;
    });
    h+=`<button class="btn btn-secondary btn-sm mt-1" onclick="addEnvTrait()">+ Trait</button> <button class="btn btn-danger btn-sm mt-1" onclick="removeEnvironment()">Remove</button>`;
  } else {
    h+='<div class="text-muted" style="font-size:12px">No environment set. Optional — represents passive scene threats.</div>';
  }
  h+='</div>';
  // TWISTS
  h+=`<div class="card"><div class="label" style="display:flex;align-items:center;gap:6px">Active Twists <button class="btn btn-secondary btn-xs" onclick="promptTwist()">+ Add</button></div>`;
  if(!S.scene.twists.length)h+='<div class="text-muted" style="font-size:12px">No twists yet.</div>';
  S.scene.twists.forEach(t=>{
    h+=`<div class="qual-row" style="${t.resolved?'opacity:.5':''}"><div class="qr-name" style="text-decoration:${t.resolved?'line-through':'none'}">${esc(t.text)}</div><button class="btn btn-secondary btn-xs" onclick="toggleTwist('${t.id}')">${t.resolved?'Reopen':'Resolve'}</button><button class="btn btn-danger btn-xs" onclick="removeTwist('${t.id}')">×</button></div>`;
  });
  h+='</div>';
  el('scene-content').innerHTML=h;
}

function removeEnvironment(){if(!confirm('Remove environment?'))return;S.environment=null;save();renderScene();}

function rollEnvTrait(i){const t=S.environment.traits[i];const r=rollDie(parseDie(t.die));alert(`Rolled ${t.die} on ${t.name||'trait'}: ${r}\n\n(Use as twist scale — see Scene zone.)`);}

// ═══════════════════════════════════════════════════════════
var ACTIONS=[
  {id:'attack',name:'Attack'},{id:'overcome',name:'Overcome'},{id:'defend',name:'Defend'},
  {id:'boost',name:'Boost'},{id:'hinder',name:'Hinder'},{id:'recover',name:'Recover'}
];
function setDicePower(opt){
  if(!opt){S.dice.powerId='';S.dice.powerName='';S.dice.powerDie='d8';S.dice.attachedPowerName='';}
  else{
    const [idx]=opt.split('|');
    const i=parseInt(idx,10);
    if(S.hero&&S.hero.powers[i]){const p=S.hero.powers[i];S.dice.powerId=p.id;S.dice.powerName=p.customName||p.baseName;S.dice.powerDie=p.die;S.dice.attachedPowerName=p.customName||p.baseName;}
  }
  save();renderDice();renderHeroDiceSidebar();
}
function setDicePowerDie(d){S.dice.powerDie=d;save();renderDice();renderHeroDiceSidebar();}
function setDiceQuality(opt){
  if(!opt){S.dice.qualityName='';S.dice.qualityDie='d8';}
  else{const i=parseInt(opt,10);if(S.hero&&S.hero.qualities[i]){const q=S.hero.qualities[i];S.dice.qualityName=q.name;S.dice.qualityDie=q.die;}}
  save();renderDice();renderHeroDiceSidebar();
}
function setDiceQualityDie(d){S.dice.qualityDie=d;save();renderDice();renderHeroDiceSidebar();}
function setDiceAction(a){S.dice.actionType=a;save();renderDice();renderHeroDiceSidebar();}
function setEffectDie(slot){S.dice.effectDie=slot;save();if(S.dice.results)resolveEffect();renderDice();renderHeroDiceSidebar();}
function clearMod(which){if(which==='bonus')S.dice.bonus=null;else S.dice.penalty=null;save();renderDice();renderHeroDiceSidebar();}
function addBonus(){const v=prompt('Bonus value (e.g., +2, +d6)');if(!v)return;S.dice.bonus={text:v,value:parseModValue(v)};save();renderDice();renderHeroDiceSidebar();}
function addPenalty(){const v=prompt('Penalty value (e.g., −2, −d6 — sign optional)');if(!v)return;S.dice.penalty={text:v,value:parseModValue(v)};save();renderDice();renderHeroDiceSidebar();}
function parseModValue(s){
  s=String(s).trim();
  const dieMatch=s.match(/d(\d+)/i);
  if(dieMatch){const sides=parseInt(dieMatch[1],10);const r=rollDie(sides);return r;}
  const num=parseInt(s.replace(/[^-0-9]/g,''),10);return isNaN(num)?0:num;
}
function rollPool(){
  if(!S.hero){alert('Create a hero first.');return;}
  S.dice.statusDie=getStatusDie();
  const arr=[
    {label:'power',roll:rollDie(parseDie(S.dice.powerDie)),die:S.dice.powerDie,name:S.dice.attachedPowerName||S.dice.powerName||'Power'},
    {label:'quality',roll:rollDie(parseDie(S.dice.qualityDie)),die:S.dice.qualityDie,name:S.dice.qualityName||'Quality'},
    {label:'status',roll:rollDie(parseDie(S.dice.statusDie)),die:S.dice.statusDie,name:'Status'}
  ];
  arr.sort((a,b)=>a.roll-b.roll);arr[0].slot='min';arr[1].slot='mid';arr[2].slot='max';
  S.dice.results=arr;
  save();renderDice();renderHeroDiceSidebar();
}
function resolveEffect(){
  const eff=S.dice.results.find(d=>d.slot===S.dice.effectDie);
  S.dice.effectValue=eff?eff.roll:0;
  let v=S.dice.effectValue;
  if(S.dice.bonus)v+=Math.abs(S.dice.bonus.value);
  if(S.dice.penalty)v-=Math.abs(S.dice.penalty.value);
  S.dice.modifiedEffect=Math.max(0,v);
}
function actionOutcomeText(action,v){
  if(action==='overcome')return v>=11?`Major Success (${v}+) — bonus side effect`:v>=8?`Success (${v}) — no twist`:v>=4?`Partial — minor twist (${v})`:`Failure or major twist (${v})`;
  if(action==='attack')return `Deal ${v} damage to target`;
  if(action==='defend')return `Reduce next damage by ${v}`;
  if(action==='boost')return `+${v<=3?'d6':v<=7?'d8':v<=11?'d10':'d12'} bonus`;
  if(action==='hinder')return `−${v<=3?'d6':v<=7?'d8':v<=11?'d10':'d12'} penalty`;
  if(action==='recover')return `Heal ${v} HP (or remove status equal to ${v})`;
  return '';
}
function renderDicePanel(opts){
  opts=opts||{};
  const d=S.dice;
  const powers=S.hero?S.hero.powers:[];
  const quals=S.hero?S.hero.qualities:[];
  const sd=S.hero?getStatusDie():'d8';
  d.statusDie=sd;
  const eZone=S.hero?getEffectiveZone():'green';
  let h=`<div class="card" style="margin-bottom:10px">
    <div class="form-group"><label>Power</label>
      <select onchange="setDicePower(this.value)"><option value="">— pick power —</option>${powers.map((p,i)=>`<option value="${i}|${p.id}" ${d.powerName===(p.customName||p.baseName)?'selected':''}>${esc(p.customName||p.baseName)} (${p.die})</option>`).join('')}</select>
    </div>
    <div class="form-group"><label>Quality</label>
      <select onchange="setDiceQuality(this.value)"><option value="">— pick quality —</option>${quals.map((q,i)=>`<option value="${i}" ${d.qualityName===q.name?'selected':''}>${esc(q.name)} (${q.die})</option>`).join('')}</select>
    </div>
    <div class="flex-row mb-2" style="gap:8px;align-items:center"><div style="flex:1;font-size:11px;color:var(--muted);font-family:var(--font-label);text-transform:uppercase;letter-spacing:.5px">Status — <span class="zone-badge ${eZone}">${eZone}</span></div><div class="die-badge ${sd}">${sd}</div></div>
    <button class="roll-btn" onclick="rollPool()">ROLL</button>
  </div>`;
  if(d.results){
    h+=`<div class="card">${d.attachedPowerName?`<div style="font-family:var(--font-title);font-size:22px;color:var(--accent);letter-spacing:1.5px;text-align:center;margin-bottom:6px">${esc(d.attachedPowerName.toUpperCase())}</div>`:''}
      <div class="dice-result">
        ${d.results.map(r=>`<div class="dr-item"><div class="dr-die">${esc(r.name)} ${r.die}</div><div class="dr-roll">${r.roll}</div><div class="dr-slot">${r.slot.toUpperCase()}</div></div>`).join('')}
      </div>
    </div>`;
  }
  return h;
}
function renderDice(){
  if(!S.hero){el('dice-content').innerHTML='<div class="pg-title">Dice</div><div class="pg-sub">Create a hero first.</div>';return;}
  el('dice-content').innerHTML=`<div class="pg-title">Dice Roller</div><div class="pg-sub">Power + Quality + Status. Tap an ability or power on your sheet to auto-load it.</div>${renderDicePanel({})}`;
}
// On desktop the dice roller is shown as a sidebar adjacent to the sheet — refresh
// it in place. On mobile it lives on its own tab, so switch tabs to surface it.
function _heroSidebarVisible(){return window.matchMedia('(min-width:700px)').matches;}
function _afterDiceLoad(){save();renderHeroDiceSidebar();if(!_heroSidebarVisible())showTab('dice');}
function loadRollFromPower(i){
  const p=S.hero.powers[i];if(!p)return;
  S.dice.powerId=p.id;S.dice.powerName=p.customName||p.baseName;S.dice.powerDie=p.die;S.dice.attachedPowerName=p.customName||p.baseName;
  _afterDiceLoad();
}
function loadRollFromQuality(i){
  const q=S.hero.qualities[i];if(!q)return;
  S.dice.qualityName=q.name;S.dice.qualityDie=q.die;
  _afterDiceLoad();
}
function loadRollFromAbility(i){
  const a=S.hero.abilities[i];if(!a)return;
  if(a.action)S.dice.actionType=a.action;
  if(a.die&&a.die!=='free')S.dice.effectDie=a.die;
  S.dice.attachedPowerName=a.name;
  if(a.powerSlot&&S.hero){const p=S.hero.powers.find(x=>x.id===a.powerSlot);if(p){S.dice.powerId=p.id;S.dice.powerName=p.customName||p.baseName;S.dice.powerDie=p.die;}}
  if(a.qualitySlot&&S.hero){const q=S.hero.qualities.find(x=>x.name===a.qualitySlot);if(q){S.dice.qualityName=q.name;S.dice.qualityDie=q.die;}}
  _afterDiceLoad();
}

// ═══════════════════════════════════════════════════════════
// NPCS / LIEUTENANTS / VILLAINS / SUPPORTING
// ═══════════════════════════════════════════════════════════
var _npcSubTab='minion',_npcDraft=null,_npcDraftIdx=null;
function setNpcSubTab(t){_npcSubTab=t;renderNPCs();}
function renderNPCs(){
  const tabs=[['minion','Minion'],['lieutenant','Lieutenant'],['villain','Villain'],['supporting','Supporting']];
  let h=`<div class="pg-title">NPCs</div><div class="pg-sub">Track minions, lieutenants, villains, and supporting cast.</div>
    <div class="npc-tabs">${tabs.map(([id,n])=>`<div class="npc-tab ${_npcSubTab===id?'active':''}" onclick="setNpcSubTab('${id}')">${n}</div>`).join('')}</div>`;
  if(_npcSubTab==='minion')h+=renderNPCMinions();
  else if(_npcSubTab==='lieutenant')h+=renderNPCList('lieutenant','Lieutenant');
  else if(_npcSubTab==='villain')h+=renderNPCList('villain','Villain');
  else h+=renderNPCList('supporting','Supporting');
  el('npcs-content').innerHTML=h;
}
function renderNPCMinions(){
  const minions=S.npcs.filter(n=>n.tier==='minion');
  let h=`<div class="card"><div class="label">Add Minion</div>
    <div class="flex-row"><input type="text" id="m-name" placeholder="Mob Goon" style="flex:1"><select id="m-die">${['d4','d6','d8','d10','d12'].map(d=>`<option ${d==='d6'?'selected':''}>${d}</option>`).join('')}</select><input type="number" id="m-count" value="1" min="1" max="10" style="width:60px"><button class="btn btn-primary btn-sm" onclick="addMinion()">+ Add</button></div></div>`;
  if(!minions.length)h+='<div class="text-muted" style="font-size:13px">No minions yet.</div>';
  minions.forEach(m=>{const idx=S.npcs.indexOf(m);
    h+=`<div class="card"><div style="display:flex;align-items:center;gap:8px"><div style="flex:1"><div style="font-family:var(--font-label);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.5px">${esc(m.name)} <span class="tag tag-die">${m.die}</span> <span style="color:var(--muted)">×${m.count}</span></div></div></div>
      <div class="flex-row mt-2" style="flex-wrap:wrap;gap:4px">
        <button class="btn btn-secondary btn-xs" onclick="adjMinionCount(${idx},-1)">−1</button>
        <button class="btn btn-secondary btn-xs" onclick="adjMinionCount(${idx},1)">+1</button>
        <button class="btn btn-info btn-xs" onclick="minionSave(${idx})">Save vs damage</button>
        <button class="btn btn-danger btn-xs" onclick="removeNPC(${idx})">×</button>
      </div></div>`;
  });
  return h;
}
function addMinion(){
  const name=el('m-name').value.trim();if(!name)return;
  const die=el('m-die').value;const count=Math.max(1,parseInt(el('m-count').value,10)||1);
  S.npcs.push({tier:'minion',id:uid(),name,die,count});
  el('m-name').value='';save();renderNPCs();
}
function adjMinionCount(i,d){const m=S.npcs[i];m.count=Math.max(0,m.count+d);if(m.count===0&&!confirm('Last one — remove minion entry?'))m.count=1;else if(m.count===0){S.npcs.splice(i,1);}save();renderNPCs();}
function minionSave(i){const m=S.npcs[i];const dmg=parseInt(prompt('Incoming damage to one minion?'),10);if(isNaN(dmg))return;const r=rollDie(parseDie(m.die));const out=r<dmg;alert(`Minion ${m.name} (${m.die}) saved: rolled ${r} vs damage ${dmg}.\n${out?'DEFEATED':'Survives'}`);if(out){adjMinionCount(i,-1);}}
function removeNPC(i){if(!confirm('Remove this NPC?'))return;S.npcs.splice(i,1);save();renderNPCs();}
function renderNPCList(tier,label){
  const list=S.npcs.filter(n=>n.tier===tier);
  let h=`<div class="flex-row mb-2"><button class="btn btn-primary btn-sm" onclick="newNPC('${tier}')">+ New ${label}</button></div>`;
  if(!list.length)h+=`<div class="text-muted" style="font-size:13px">No ${label.toLowerCase()}s yet.</div>`;
  list.forEach(n=>{const idx=S.npcs.indexOf(n);
    let summary='';
    if(tier==='lieutenant'||tier==='villain'){const z=n.status?getHeroZone(n.status.currentHP,n.status):'green';summary=`HP ${n.status?.currentHP||'?'}/${n.status?.max||'?'} <span class="zone-badge ${z}">${z.toUpperCase()}</span>`;}
    h+=`<div class="card"><div style="display:flex;align-items:center;gap:8px"><div style="flex:1"><div style="font-family:var(--font-title);font-size:20px;color:var(--accent);letter-spacing:1px">${esc(n.name||'(unnamed)')}</div>${tier==='villain'?`<div style="font-size:11px;color:var(--muted);font-family:var(--font-label);text-transform:uppercase;letter-spacing:.5px">${esc(VILLAIN_APPROACHES.find(x=>x.id===n.approachId)?.name||'')} · ${esc(VILLAIN_ARCHETYPES.find(x=>x.id===n.archetypeId)?.name||'')}</div>`:''}<div style="font-size:12px;color:var(--muted)">${summary}</div></div></div>
      ${(tier==='lieutenant'||tier==='villain')&&n.status?`<div class="mt-2">${renderHPBar(n.status.currentHP,n.status)}<div class="flex-row mt-1" style="gap:4px;flex-wrap:wrap"><button class="hp-btn danger" onclick="adjustNPCHP(${idx},-3)">−3</button><button class="hp-btn danger" onclick="adjustNPCHP(${idx},-5)">−5</button><button class="hp-btn danger" onclick="adjustNPCHP(${idx},-10)">−10</button><input type="number" id="npc-d-${idx}" placeholder="dmg" style="width:70px;padding:6px 8px;font-size:12px"><button class="btn btn-secondary btn-xs" onclick="applyNPCDamage(${idx})">Apply</button>${tier==='lieutenant'?`<button class="btn btn-info btn-xs" onclick="checkMassive(${idx})">Massive?</button>`:''}<button class="hp-btn heal" onclick="adjustNPCHP(${idx},5)">+5</button></div></div>`:''}
      <div class="flex-row mt-2"><button class="btn btn-secondary btn-xs" onclick="editNPC(${idx})">Edit</button><button class="btn btn-info btn-xs" onclick="viewNPC(${idx})">View</button><button class="btn btn-danger btn-xs" onclick="removeNPC(${idx})">×</button></div>
    </div>`;
  });
  return h;
}
function adjustNPCHP(i,d){const n=S.npcs[i];if(!n.status)return;n.status.currentHP=Math.max(0,Math.min(n.status.max,n.status.currentHP+d));save();renderNPCs();}
function applyNPCDamage(i){const v=parseInt(el('npc-d-'+i).value,10)||0;if(v)adjustNPCHP(i,-v);el('npc-d-'+i).value='';}
function checkMassive(i){const n=S.npcs[i];const z=getHeroZone(n.status.currentHP,n.status);const die=ZONE_DIE[z];const sides=parseDie(die);const dmg=parseInt(prompt(`Lieutenant is in ${z.toUpperCase()} (${die}). Single-attack damage to check?`),10);if(isNaN(dmg))return;if(dmg>=2*sides){alert(`MASSIVE DAMAGE! ${dmg} ≥ 2×${sides}. Lieutenant is immediately defeated.`);adjustNPCHP(i,-n.status.currentHP);}else alert(`Not massive: ${dmg} < 2×${sides}.`);}
function viewNPC(i){
  const n=S.npcs[i];
  let h=`<div class="pg-title" style="font-size:22px">${esc(n.name)}</div>`;
  if(n.tier==='villain'){h+=`<div class="hero-tags"><span class="hero-tag">${esc(VILLAIN_APPROACHES.find(x=>x.id===n.approachId)?.name||'')}</span><span class="hero-tag">${esc(VILLAIN_ARCHETYPES.find(x=>x.id===n.archetypeId)?.name||'')}</span>${(n.upgrades||[]).map(u=>`<span class="hero-tag">${esc(VILLAIN_UPGRADES.find(x=>x.id===u)?.name||u)}</span>`).join('')}</div>`;}
  if(n.status){h+=`<div class="card-sm">${renderHPBar(n.status.currentHP,n.status)}</div>`;}
  if(n.powers&&n.powers.length){h+='<div class="card-sm"><div class="label">Powers</div>'+n.powers.map(p=>`<div class="qual-row"><div class="qr-name">${esc(p.name)}</div><div class="die-badge ${p.die}">${p.die}</div></div>`).join('')+'</div>';}
  if(n.qualities&&n.qualities.length){h+='<div class="card-sm"><div class="label">Qualities</div>'+n.qualities.map(q=>`<div class="qual-row"><div class="qr-name">${esc(q.name)}</div><div class="die-badge ${q.die}">${q.die}</div></div>`).join('')+'</div>';}
  if(n.abilities&&n.abilities.length){h+='<div class="card-sm"><div class="label">Abilities</div>'+n.abilities.map(a=>`<div class="ability-card"><div class="ab-name">${esc(a.name)} <span class="zone-badge ${a.zone}">${a.zone}</span> <span class="tag tag-${a.type}">${esc(a.type)}</span></div><div class="ab-text">${esc(a.text)}</div></div>`).join('')+'</div>';}
  if(n.minions&&n.minions.length){h+='<div class="card-sm"><div class="label">Minions</div>'+n.minions.map(m=>`<div class="qual-row"><div class="qr-name">${esc(m.name||'Minion')}</div><div class="die-badge ${m.die}">${m.die}</div><div>×${m.count}</div></div>`).join('')+'</div>';}
  if(n.notes)h+=`<div class="card-sm"><div class="label">Notes</div><div style="font-size:12px;white-space:pre-wrap">${esc(n.notes)}</div></div>`;
  h+='<button class="btn btn-secondary btn-full mt-2" onclick="closeModal(\'npc-modal\')">Close</button>';
  el('npc-modal-body').innerHTML=h;openModal('npc-modal');
}
function newNPC(tier){
  const max=(tier==='villain'?30:tier==='lieutenant'?15:0);
  _npcDraft={id:uid(),tier,name:'',
    approachId:tier==='villain'?'mastermind':null,
    archetypeId:tier==='villain'?'bruiser':null,
    upgrades:[],minions:[],
    status:tier==='lieutenant'||tier==='villain'?{...VILLAIN_HEALTH_RANGES.find(r=>r.max===max)||VILLAIN_HEALTH_RANGES[1],greenMin:0,greenMax:0,yellowMin:0,yellowMax:0,redMin:0,redMax:0,currentHP:max,max}:null,
    powers:[],qualities:[],abilities:[],
    healthChartIdx:tier==='villain'?3:1,
    notes:''};
  if(_npcDraft.status){applyNPCHealthChart(_npcDraft);}
  _npcDraftIdx=null;openNPCEditor();
}
function applyNPCHealthChart(n){
  const chart=VILLAIN_HEALTH_RANGES[n.healthChartIdx]||VILLAIN_HEALTH_RANGES[1];
  n.status.max=chart.max;n.status.greenMin=chart.green[0];n.status.greenMax=chart.green[1];
  n.status.yellowMin=chart.yellow[0];n.status.yellowMax=chart.yellow[1];
  n.status.redMin=chart.red[0];n.status.redMax=chart.red[1];
  if(!n.status.currentHP||n.status.currentHP>n.status.max)n.status.currentHP=n.status.max;
}
function editNPC(idx){_npcDraft=JSON.parse(JSON.stringify(S.npcs[idx]));_npcDraftIdx=idx;openNPCEditor();}
function openNPCEditor(){renderNPCEditor();openModal('npc-modal');}
function renderNPCEditor(){
  const n=_npcDraft;if(!n)return;
  const isV=n.tier==='villain',isL=n.tier==='lieutenant';
  let h=`<div class="pg-title" style="font-size:20px">${_npcDraftIdx==null?'New':'Edit'} ${n.tier[0].toUpperCase()+n.tier.slice(1)}</div>`;
  h+=`<div class="form-group"><label>Name</label><input type="text" id="np-name" value="${esc(n.name)}" oninput="_npcDraft.name=this.value"></div>`;
  if(isV){
    h+=`<div class="label">Approach (15)</div><div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px">${VILLAIN_APPROACHES.map(a=>`<button class="btn btn-xs ${n.approachId===a.id?'btn-primary':'btn-secondary'}" onclick="_npcDraft.approachId='${a.id}';renderNPCEditor()">${esc(a.name)}</button>`).join('')}</div>`;
    if(n.approachId){const a=findById(VILLAIN_APPROACHES,n.approachId);h+=`<div class="card-sm"><div style="font-size:12px"><b>${esc(a.name)}:</b> ${esc(a.brief)}</div><div style="font-size:11px;color:var(--accent);margin-top:4px"><b>Advance trigger:</b> ${esc(a.advance)}</div></div>`;}
    h+=`<div class="label">Archetype (14)</div><div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px">${VILLAIN_ARCHETYPES.map(a=>`<button class="btn btn-xs ${n.archetypeId===a.id?'btn-primary':'btn-secondary'}" onclick="_npcDraft.archetypeId='${a.id}';renderNPCEditor()">${esc(a.name)}</button>`).join('')}</div>`;
    if(n.archetypeId){const a=findById(VILLAIN_ARCHETYPES,n.archetypeId);h+=`<div class="card-sm"><div style="font-size:12px"><b>${esc(a.name)}:</b> ${esc(a.brief)}</div><div style="font-size:11px;color:var(--accent);margin-top:4px"><b>Dice rule:</b> ${esc(a.rule)}</div></div>`;}
  }
  if(n.status){
    h+=`<div class="label">Health Tier</div><div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px">${VILLAIN_HEALTH_RANGES.map((r,i)=>`<button class="btn btn-xs ${n.healthChartIdx===i?'btn-primary':'btn-secondary'}" onclick="_npcDraft.healthChartIdx=${i};applyNPCHealthChart(_npcDraft);renderNPCEditor()">${r.max}</button>`).join('')}</div>
      ${renderHPBar(n.status.currentHP,n.status)}`;
    if(isL)h+=`<div class="card-sm" style="background:rgba(231,76,60,.05);border-color:rgba(231,76,60,.3);font-size:12px"><b>Massive Damage Rule:</b> Defeated immediately if dealt ≥ 2× current status die size in one attack.</div>`;
  }
  // Powers
  h+=`<div class="label" style="display:flex;align-items:center;gap:6px">Powers <button class="btn btn-secondary btn-xs" onclick="_npcDraft.powers.push({name:'',die:'d8'});renderNPCEditor()">+ Power</button></div>`;
  n.powers.forEach((p,i)=>{h+=`<div class="qual-row"><input type="text" value="${esc(p.name)}" oninput="_npcDraft.powers[${i}].name=this.value" placeholder="Power name" style="flex:1"><select onchange="_npcDraft.powers[${i}].die=this.value">${['d6','d8','d10','d12'].map(d=>`<option ${p.die===d?'selected':''}>${d}</option>`).join('')}</select><button class="btn btn-danger btn-xs" onclick="_npcDraft.powers.splice(${i},1);renderNPCEditor()">×</button></div>`;});
  // Qualities
  h+=`<div class="label" style="display:flex;align-items:center;gap:6px">Qualities <button class="btn btn-secondary btn-xs" onclick="_npcDraft.qualities.push({name:'',die:'d8'});renderNPCEditor()">+ Quality</button></div>`;
  n.qualities.forEach((q,i)=>{h+=`<div class="qual-row"><input type="text" value="${esc(q.name)}" oninput="_npcDraft.qualities[${i}].name=this.value" placeholder="Quality name" list="np-qlist" style="flex:1"><select onchange="_npcDraft.qualities[${i}].die=this.value">${['d6','d8','d10','d12'].map(d=>`<option ${q.die===d?'selected':''}>${d}</option>`).join('')}</select><button class="btn btn-danger btn-xs" onclick="_npcDraft.qualities.splice(${i},1);renderNPCEditor()">×</button></div>`;});
  h+=`<datalist id="np-qlist">${QUALITIES.map(q=>`<option value="${esc(q.name)}">`).join('')}</datalist>`;
  // Abilities
  h+=`<div class="label" style="display:flex;align-items:center;gap:6px">Abilities <button class="btn btn-secondary btn-xs" onclick="_npcDraft.abilities.push({zone:'green',type:'action',action:'attack',die:'mid',name:'',text:''});renderNPCEditor()">+ Ability</button></div>`;
  n.abilities.forEach((a,i)=>{h+=`<div class="card-sm" style="background:var(--surface)">
    <div class="grid-2"><div class="form-group"><label>Zone</label><select onchange="_npcDraft.abilities[${i}].zone=this.value">${['green','yellow','red','out'].map(x=>`<option ${a.zone===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label>Type</label><select onchange="_npcDraft.abilities[${i}].type=this.value">${['action','reaction','inherent'].map(x=>`<option ${a.type===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
    <div class="grid-2"><div class="form-group"><label>Action</label><select onchange="_npcDraft.abilities[${i}].action=this.value">${['','attack','defend','overcome','boost','hinder','recover'].map(x=>`<option value="${x}" ${a.action===x?'selected':''}>${x||'(none)'}</option>`).join('')}</select></div><div class="form-group"><label>Die</label><select onchange="_npcDraft.abilities[${i}].die=this.value">${['min','mid','max','free'].map(x=>`<option ${a.die===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
    <div class="form-group"><label>Name</label><input type="text" value="${esc(a.name)}" oninput="_npcDraft.abilities[${i}].name=this.value"></div>
    <div class="form-group"><label>Text</label><textarea oninput="_npcDraft.abilities[${i}].text=this.value">${esc(a.text)}</textarea></div>
    <button class="btn btn-danger btn-xs" onclick="_npcDraft.abilities.splice(${i},1);renderNPCEditor()">Remove</button>
  </div>`;});
  // Villain upgrades
  if(isV){
    h+=`<div class="label">Upgrades</div>`;
    VILLAIN_UPGRADES.forEach(u=>{const has=n.upgrades.includes(u.id);h+=`<div class="qual-row"><label style="flex:1;font-family:var(--font-label);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px"><input type="checkbox" ${has?'checked':''} onchange="toggleUpgrade('${u.id}')" style="width:auto;margin-right:6px">${esc(u.name)}</label><div style="font-size:11px;color:var(--muted)">${esc(u.desc)}</div></div>`;});
    if(n.upgrades.includes('mook_squad')){
      h+=`<div class="card-sm"><div class="label">Mook Squad</div>`;
      n.minions.forEach((m,i)=>{h+=`<div class="qual-row"><input type="text" value="${esc(m.name||'')}" oninput="_npcDraft.minions[${i}].name=this.value" placeholder="Mook name" style="flex:1"><select onchange="_npcDraft.minions[${i}].die=this.value">${['d4','d6','d8','d10','d12'].map(d=>`<option ${m.die===d?'selected':''}>${d}</option>`).join('')}</select><input type="number" value="${m.count}" oninput="_npcDraft.minions[${i}].count=parseInt(this.value)||1" style="width:60px"><button class="btn btn-danger btn-xs" onclick="_npcDraft.minions.splice(${i},1);renderNPCEditor()">×</button></div>`;});
      h+=`<button class="btn btn-secondary btn-sm mt-1" onclick="_npcDraft.minions.push({name:'Mook',die:'d6',count:3});renderNPCEditor()">+ Mook</button></div>`;
    }
  }
  h+=`<div class="form-group"><label>Notes</label><textarea oninput="_npcDraft.notes=this.value">${esc(n.notes||'')}</textarea></div>
    <div class="flex-row mt-2"><button class="btn btn-primary" onclick="saveNPCDraft()">Save</button><button class="btn btn-secondary" onclick="closeModal('npc-modal')">Cancel</button></div>`;
  el('npc-modal-body').innerHTML=h;
}
function toggleUpgrade(id){const arr=_npcDraft.upgrades;const i=arr.indexOf(id);if(i>=0)arr.splice(i,1);else arr.push(id);renderNPCEditor();}
function saveNPCDraft(){
  if(!_npcDraft.name.trim()){alert('Name required.');return;}
  if(_npcDraftIdx==null)S.npcs.push(_npcDraft);else S.npcs[_npcDraftIdx]=_npcDraft;
  _npcDraft=null;_npcDraftIdx=null;save();closeModal('npc-modal');renderNPCs();
}

// ═══════════════════════════════════════════════════════════
// JOURNAL
// ═══════════════════════════════════════════════════════════
function renderJournal(){
  let h=`<div class="pg-title">Journal</div><div class="pg-sub">Log your scenes, twists, and key moments.</div>
    <div class="flex-row mb-2" style="flex-wrap:wrap;gap:6px">
      <button class="btn btn-primary btn-sm" onclick="addJournalEntry()">+ Entry</button>
      <button class="btn btn-secondary btn-sm" onclick="addIssueBreak()">+ Issue Break</button>
    </div>`;
  if(!S.journal.length)h+='<div class="text-muted" style="font-size:13px">No entries yet.</div>';
  S.journal.forEach((e,i)=>{
    if(e.type==='issue_break'){h+=`<div class="log-issue"><div class="log-issue-label">${esc(e.title||'Issue Break')}</div></div>`;return;}
    const t=LOG_TYPES.find(x=>x.key===e.type)||LOG_TYPES[0];
    h+=`<div class="${t.cls}"><div style="display:flex;align-items:flex-start;gap:8px"><div style="font-size:18px">${t.emoji}</div><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><div style="font-family:var(--font-label);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px">${esc(e.title||t.label)}</div><span class="tag tag-die">${esc(t.label)}</span>${e.date?`<span style="font-size:10px;color:var(--muted)">${esc(e.date)}</span>`:''}</div><div style="font-size:13px;white-space:pre-wrap;margin-top:4px">${esc(e.body||'')}</div></div><div style="display:flex;flex-direction:column;gap:3px"><button class="btn btn-secondary btn-xs" onclick="editJournalEntry(${i})">✎</button><button class="btn btn-danger btn-xs" onclick="deleteJournalEntry(${i})">×</button></div></div></div>`;
  });
  el('journal-content').innerHTML=h;
}
function addJournalEntry(){_jeIdx=null;openJournalEditor();}
function editJournalEntry(i){_jeIdx=i;openJournalEditor();}
function deleteJournalEntry(i){if(!confirm('Delete entry?'))return;S.journal.splice(i,1);save();renderJournal();}
function addIssueBreak(){const t=prompt('Issue title (e.g., Issue #1: Origins)');if(!t)return;S.journal.push({id:uid(),type:'issue_break',title:t,date:new Date().toISOString().slice(0,10)});save();renderJournal();}
var _jeIdx=null;
function openJournalEditor(){
  const e=_jeIdx!=null?S.journal[_jeIdx]:{id:uid(),type:'main',title:'',body:'',date:new Date().toISOString().slice(0,10)};
  let h=`<div class="pg-title" style="font-size:20px">${_jeIdx!=null?'Edit':'New'} Entry</div>
    <div class="form-group"><label>Type</label><select id="je-type">${LOG_TYPES.map(t=>`<option value="${t.key}" ${e.type===t.key?'selected':''}>${t.emoji} ${esc(t.label)}</option>`).join('')}</select></div>
    <div class="form-group"><label>Title</label><input type="text" id="je-title" value="${esc(e.title)}" placeholder="optional"></div>
    <div class="form-group"><label>Date</label><input type="text" id="je-date" value="${esc(e.date||'')}" placeholder="YYYY-MM-DD"></div>
    <div class="form-group"><label>Body</label><textarea id="je-body" style="min-height:140px">${esc(e.body)}</textarea></div>
    <div class="flex-row mt-2"><button class="btn btn-primary" onclick="saveJournalEntry()">Save</button><button class="btn btn-secondary" onclick="closeModal('npc-modal')">Cancel</button></div>`;
  el('npc-modal-body').innerHTML=h;openModal('npc-modal');
}
function saveJournalEntry(){
  const e={id:_jeIdx!=null?S.journal[_jeIdx].id:uid(),type:el('je-type').value,title:el('je-title').value.trim(),body:el('je-body').value,date:el('je-date').value.trim()};
  if(_jeIdx!=null)S.journal[_jeIdx]=e;else S.journal.push(e);
  save();closeModal('npc-modal');renderJournal();
}

// ═══════════════════════════════════════════════════════════
// EXPORT HERO SHEET
// ═══════════════════════════════════════════════════════════
function exportHeroSheet(){
  if(!S.hero){alert('No hero to export.');return;}
  const h=S.hero;
  const bg=findById(BACKGROUNDS,h.backgroundId),ps=findById(POWER_SOURCES,h.powerSourceId),ar=findById(ARCHETYPES,h.archetypeId),pe=findById(PERSONALITIES,h.personalityId);
  const css=`*{box-sizing:border-box;font-family:'Comic Neue','Segoe UI',sans-serif}body{margin:0;padding:18px;background:#fff;color:#222;font-size:13px;line-height:1.5;max-width:920px;margin:auto}h1{font-family:'Bangers',cursive;font-size:38px;color:#cc3322;letter-spacing:1.5px;margin:0}h2{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:#cc3322;border-bottom:2px solid #cc3322;padding-bottom:3px;margin:14px 0 8px}.tags span{display:inline-block;margin:2px;padding:2px 10px;background:#f0ece0;border:1px solid #c8c0a8;border-radius:14px;font-size:11px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px}.col2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#faf8f0;border:1px solid #c8c0a8;border-radius:8px;padding:10px;margin-bottom:8px}.zone-g{color:#3d8b3d}.zone-y{color:#c89020}.zone-r{color:#cc3322}.die{display:inline-block;padding:2px 7px;background:#cc3322;color:#fff;border-radius:4px;font-family:'Oswald',sans-serif;font-weight:700;font-size:11px}.muted{color:#888;font-size:11px}.italic{font-style:italic;color:#666}@media print{body{padding:6px}.no-print{display:none}}.toolbar{margin-bottom:14px}button{padding:8px 16px;background:#cc3322;color:#fff;border:none;border-radius:6px;font-family:'Oswald';cursor:pointer}`;
  let body=`<div class="toolbar no-print"><button onclick="window.print()">Print / Save PDF</button></div>
    <h1>${esc(h.name)}</h1>${h.alias?`<div class="italic" style="margin-bottom:6px">aka ${esc(h.alias)}</div>`:''}
    <div class="tags">${bg?`<span>${esc(bg.name)}</span>`:''}${ps?`<span>${esc(ps.name)}</span>`:''}${ar?`<span>${esc(ar.name)}</span>`:''}${pe?`<span>${esc(pe.name)}</span>`:''}</div>
    <div class="col2">
      <div>
        <h2>Status</h2>
        <div class="card"><b>Max HP:</b> ${h.status.max}<br><b class="zone-g">Green:</b> ${h.status.greenMin}-${h.status.greenMax} (d8)<br><b class="zone-y">Yellow:</b> ${h.status.yellowMin}-${h.status.yellowMax} (d6)<br><b class="zone-r">Red:</b> ${h.status.redMin}-${h.status.redMax} (d4)</div>
        <h2>Status Die Assignments</h2>
        <div class="card">Green→${h.statusAssignments?.green?.toUpperCase()||'MID'} · Yellow→${h.statusAssignments?.yellow?.toUpperCase()||'MID'} · Red→${h.statusAssignments?.red?.toUpperCase()||'MID'}</div>
        <h2>Hero Points</h2>
        <div class="card">${[1,2,3,4,5].map(i=>i<=h.heroPoints?'●':'○').join(' ')} (${h.heroPoints}/${h.maxHeroPoints})</div>
        <h2>Principles</h2>
        ${h.principles.map(p=>`<div class="card"><b>${esc(p.name)}</b> <span class="muted">(${esc(p.cat)})</span><div class="italic">Minor: ${esc(p.minor)} · Major: ${esc(p.major)}</div><div><b>Ability:</b> ${esc(p.ability)}</div></div>`).join('')||'<div class="muted">none</div>'}
        <h2>Qualities</h2>
        ${h.qualities.map(q=>`<div class="card"><b>${esc(q.name)}</b> <span class="die">${q.die}</span></div>`).join('')||'<div class="muted">none</div>'}
      </div>
      <div>
        <h2>Powers</h2>
        ${h.powers.map(p=>`<div class="card"><b>${esc(p.customName||p.baseName)}</b> <span class="die">${p.die}</span><div class="muted">${esc(POWER_CATEGORIES.find(c=>c.id===p.categoryId)?.name||'')} · ${esc(p.baseName)}</div><div class="italic">${esc(p.desc||'')}</div></div>`).join('')||'<div class="muted">none</div>'}
        ${['green','yellow','red','out'].map(z=>{const list=h.abilities.filter(a=>a.zone===z);if(!list.length)return'';return `<h2>${z.toUpperCase()} Abilities</h2>${list.map(a=>{const baseLbl=a.baseName&&a.baseName!==a.name?` <span class="muted">(${esc(a.baseName)})</span>`:'';return `<div class="card"><b>${esc(a.name)}</b>${baseLbl} <span class="muted">[${esc(a.type)}${a.die==='free'?'':' / '+a.die}]</span><div>${esc(renderAbilityText(a))}</div></div>`;}).join('')}`;}).join('')}
        ${h.backstory?`<h2>Backstory</h2><div class="card" style="white-space:pre-wrap">${esc(h.backstory)}</div>`:''}
        ${h.appearance?`<h2>Appearance</h2><div class="card" style="white-space:pre-wrap">${esc(h.appearance)}</div>`:''}
      </div>
    </div>`;
  const html=`<!DOCTYPE html><html><head><title>${esc(h.name)} — Sentinel Comics</title><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@400;700&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet"><style>${css}</style></head><body>${body}</body></html>`;
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const w=window.open(url,'_blank');
  if(!w){URL.revokeObjectURL(url);alert('Allow pop-ups to view the export.');return;}
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

// ═══════════════════════════════════════════════════════════
// TOUCH DRAG-AND-DROP SHIM
// HTML5 drag-and-drop isn't dispatched for touch input on iOS/Android.
// Watch touch events on draggable elements and synthesize the standard
// dragstart/dragover/dragleave/drop/dragend events with a minimal
// dataTransfer shim so the existing inline handlers keep working.
// ═══════════════════════════════════════════════════════════
(function installTouchDnd(){
  if(!('ontouchstart' in window)&&!(navigator.maxTouchPoints>0))return;
  let src=null,dt=null,lastOver=null,ghost=null,sx=0,sy=0,active=false;
  const THRESHOLD=8;
  function makeDT(){const m={};return{setData:(t,v)=>{m[t]=String(v);},getData:t=>m[t]||'',clearData:t=>{if(t)delete m[t];else for(const k in m)delete m[k];},setDragImage(){},effectAllowed:'all',dropEffect:'move',types:[]};}
  function fire(el,type,x,y){
    if(!el)return null;
    const ev=new Event(type,{bubbles:true,cancelable:true});
    Object.defineProperty(ev,'dataTransfer',{value:dt,configurable:true});
    Object.defineProperty(ev,'clientX',{value:x,configurable:true});
    Object.defineProperty(ev,'clientY',{value:y,configurable:true});
    el.dispatchEvent(ev);
    return ev;
  }
  function findDraggable(node){while(node&&node!==document.body){if(node.getAttribute&&node.getAttribute('draggable')==='true')return node;node=node.parentNode;}return null;}
  function elemAt(x,y){if(ghost)ghost.style.display='none';const el=document.elementFromPoint(x,y);if(ghost)ghost.style.display='';return el;}
  document.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    const el=findDraggable(e.target);if(!el)return;
    src=el;const t=e.touches[0];sx=t.clientX;sy=t.clientY;dt=makeDT();active=false;lastOver=null;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!src)return;
    const t=e.touches[0];
    if(!active){
      if(Math.abs(t.clientX-sx)<THRESHOLD&&Math.abs(t.clientY-sy)<THRESHOLD)return;
      active=true;
      fire(src,'dragstart',sx,sy);
      const r=src.getBoundingClientRect();
      ghost=src.cloneNode(true);
      ghost.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;margin:0;pointer-events:none;opacity:.85;z-index:9999;transform:scale(1.1);box-shadow:0 4px 14px rgba(0,0,0,.5)`;
      document.body.appendChild(ghost);
    }
    e.preventDefault();
    if(ghost){ghost.style.left=(t.clientX-ghost.offsetWidth/2)+'px';ghost.style.top=(t.clientY-ghost.offsetHeight/2)+'px';}
    const over=elemAt(t.clientX,t.clientY);
    if(over!==lastOver){if(lastOver)fire(lastOver,'dragleave',t.clientX,t.clientY);lastOver=over;}
    if(over)fire(over,'dragover',t.clientX,t.clientY);
  },{passive:false});
  function finish(e){
    if(!src){return;}
    if(active){
      const t=(e.changedTouches&&e.changedTouches[0])||{clientX:sx,clientY:sy};
      const drop=elemAt(t.clientX,t.clientY);
      if(drop)fire(drop,'drop',t.clientX,t.clientY);
      fire(src,'dragend',t.clientX,t.clientY);
    }
    if(ghost){ghost.remove();ghost=null;}
    src=null;dt=null;lastOver=null;active=false;
  }
  document.addEventListener('touchend',finish);
  document.addEventListener('touchcancel',finish);
})();

  let a=null;try{a=localStorage.getItem('sc_active_slot');}catch(e){}
